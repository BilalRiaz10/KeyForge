<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KeyForge - Secure, client-side, free password generator built with Web Crypto API. Generate strong passwords instantly in your browser.">
  <title>KeyForge | Secure & Client-Side Password Generator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>KeyForge</h1>
          <p class="subtitle">Secure • Client-side • Free</p>
        </div>
      </div>
      
      <!-- Theme Switcher Button -->
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark/light mode" title="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </header>

    <!-- Main Generator Card -->
    <main class="generator-card">
      
      <!-- Output Password Field -->
      <div class="password-display-wrapper">
        <div class="password-field-container">
          <input 
            type="text" 
            id="password-output" 
            class="password-output" 
            readonly 
            placeholder="Click Generate" 
            aria-label="Generated Password"
          />
          <div class="action-buttons">
            <button id="btn-generate" class="action-btn icon-btn" title="Generate New Password" aria-label="Generate Password">
              <svg id="generate-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
              </svg>
            </button>
            <button id="btn-copy" class="action-btn copy-btn" title="Copy to Clipboard" aria-label="Copy Password">
              <svg class="copy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span id="copy-text">Copy</span>
            </button>
          </div>
        </div>
        
        <!-- Toast Feedback Notification -->
        <div id="toast" class="toast-message" aria-live="polite">Copied to clipboard!</div>
      </div>

      <!-- Password Strength Indicator -->
      <section class="strength-section" aria-label="Password Strength">
        <div class="strength-header">
          <span class="strength-title">Strength: <strong id="strength-label">Strong</strong></span>
          <span id="entropy-display" class="entropy-badge">78 bits entropy</span>
        </div>
        <div class="strength-meter-container">
          <div id="strength-bar" class="strength-bar" style="width: 75%; background-color: var(--strength-strong);"></div>
        </div>
      </section>

      <!-- Warning Banner for No Selection -->
      <div id="warning-banner" class="warning-banner" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Please select at least one character type to generate a password.</span>
      </div>

      <!-- Controls & Options -->
      <div class="controls-section">
        
        <!-- Length Slider Control -->
        <div class="control-group">
          <div class="control-label-row">
            <label for="length-slider" class="control-label">Password Length</label>
            <span id="length-val" class="length-badge">16</span>
          </div>
          <div class="slider-wrapper">
            <input 
              type="range" 
              id="length-slider" 
              min="8" 
              max="64" 
              value="16" 
              step="1"
              aria-label="Password length"
            />
          </div>
        </div>

        <!-- Character Options Checkboxes -->
        <fieldset class="options-fieldset">
          <legend class="control-label">Character Sets</legend>

          <label class="checkbox-option">
            <input type="checkbox" id="chk-uppercase" checked />
            <span class="custom-checkbox"></span>
            <span class="option-text">Uppercase Letters <span class="char-preview">(A-Z)</span></span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="chk-lowercase" checked />
            <span class="custom-checkbox"></span>
            <span class="option-text">Lowercase Letters <span class="char-preview">(a-z)</span></span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="chk-numbers" checked />
            <span class="custom-checkbox"></span>
            <span class="option-text">Numbers <span class="char-preview">(0-9)</span></span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="chk-symbols" checked />
            <span class="custom-checkbox"></span>
            <span class="option-text">Symbols <span class="char-preview">(!@#$%^&*)</span></span>
          </label>

          <div class="option-divider"></div>

          <label class="checkbox-option">
            <input type="checkbox" id="chk-exclude-ambiguous" />
            <span class="custom-checkbox"></span>
            <span class="option-text">Exclude Ambiguous Characters <span class="char-preview">(0, O, 1, l, I)</span></span>
          </label>
        </fieldset>

      </div>

      <!-- Main Generate CTA Button -->
      <button id="btn-main-generate" class="main-generate-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 21h5v-5"/>
        </svg>
        Generate Password
      </button>

    </main>

    <!-- Footer note -->
    <footer class="app-footer">
      <p>🛡️ Passwords are generated using <code>crypto.getRandomValues()</code> and never leave your browser.</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
